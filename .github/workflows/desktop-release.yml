name: CRM Desktop - Build e Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-base-apps

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Dependências NPM
        working-directory: desktop
        run: npm ci

      - name: Build frontend React para o Desktop
        working-directory: frontend
        env:
          VITE_API_URL: https://email-campaign-19.preview.emergentagent.com/api
        run: |
          npm install
          npm run build

      - name: Empacotar frontend no Desktop
        shell: bash
        run: |
          # O Desktop deve conter exclusivamente o build React recém-gerado.
          rm -rf desktop/dist
          mkdir -p desktop/dist
          cp -R frontend/dist/. desktop/dist/

      - name: Validar frontend embarcado no Desktop
        shell: bash
        run: |
          test -f desktop/dist/index.html
          test -d desktop/dist/assets
          grep -q '<div id="root"></div>' desktop/dist/index.html
          ! grep -q 'Verifique sua conexão com a internet' desktop/dist/index.html
          ! grep -q 'Abrir CRM' desktop/dist/index.html
          echo "Frontend React premium validado em desktop/dist"

      - name: Build e publicar Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'CRM Operacional AmPm Desktop v__VERSION__'
          releaseBody: |
            CRM Operacional AmPm Desktop.
            Build corporativo Windows e Linux.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
