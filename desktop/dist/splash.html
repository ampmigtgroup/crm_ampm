<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Operacional AmPm</title>
<style>
:root{
  --orange:#F36F21; --yellow:#FFC20E; --blue:#245A9B;
  --blue2:#1E4C83; --ink:#202A35; --muted:#718091; --bg:#F6F8FB;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 88% 14%,rgba(255,194,14,.25),transparent 29%),
    radial-gradient(circle at 8% 92%,rgba(36,90,155,.14),transparent 31%),
    linear-gradient(145deg,#fff 0%,var(--bg) 100%);
}
.wrap{height:100%;padding:34px 40px 28px;position:relative}
.top{display:flex;align-items:center;gap:17px}
.logo{
  width:66px;height:66px;border-radius:19px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--orange),#FF8A20);
  box-shadow:0 15px 32px rgba(243,111,33,.29);position:relative;
}
.logo b{color:#fff;font-size:19px;letter-spacing:-1px;margin-top:-6px}
.logo:after{content:"";position:absolute;width:35px;height:7px;border-radius:99px;background:var(--yellow);bottom:12px}
.brand h1{margin:0;font-size:24px;letter-spacing:-.5px}
.brand p{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:650}
.hero{margin-top:35px}
.online{display:flex;align-items:center;gap:9px;color:var(--blue);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.07em}
.online i{display:block;width:9px;height:9px;border-radius:50%;background:#25A967;box-shadow:0 0 0 5px rgba(37,169,103,.12)}
.hero h2{margin:13px 0 7px;font-size:31px;letter-spacing:-.8px;line-height:1.07}
.hero p{margin:0;color:var(--muted);font-size:13px}
.loader{margin-top:29px;height:8px;background:#E5EAF0;border-radius:99px;overflow:hidden}
.loader span{display:block;height:100%;width:36%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--yellow));animation:go 1.35s ease-in-out infinite}
@keyframes go{0%{transform:translateX(-115%)}60%{transform:translateX(170%)}100%{transform:translateX(330%)}}
.status{margin-top:11px;display:flex;justify-content:space-between;color:#8894A1;font-size:11px;font-weight:700}
.foot{position:absolute;left:40px;right:40px;bottom:22px;display:flex;justify-content:space-between;font-size:11px;font-weight:800}
.version{color:#9BA4AE}.igt{color:var(--blue);letter-spacing:.09em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><b>CRM</b></div>
    <div class="brand">
      <h1>CRM Operacional AmPm</h1>
      <p>Gestão operacional • treinamento • performance</p>
    </div>
  </div>
  <div class="hero">
    <div class="online"><i></i>Sistema corporativo online</div>
    <h2>Preparando seu ambiente</h2>
    <p>Carregando dados, permissões e módulos do CRM.</p>
    <div class="loader"><span></span></div>
    <div class="status"><span>Inicializando aplicação…</span><span>Conexão segura</span></div>
  </div>
  <div class="foot"><span class="version">Desktop Corporativo V6.0</span><span class="igt">IGT GROUP</span></div>
</div>
</body>
</html>
